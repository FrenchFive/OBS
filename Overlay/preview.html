<!DOCTYPE html><html><head><meta charset="utf-8"><title>Overlay preview</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;background:
 radial-gradient(58% 68% at 60% 44%, #91a6b2 0%, #5a7482 34%, #2d3d48 70%, #16202a 100%)}
#bg:after{content:"";position:absolute;inset:0;opacity:.45;background:
 repeating-linear-gradient(38deg, rgba(255,255,255,.06) 0 26px, rgba(0,0,0,.06) 26px 52px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
</style></head><body><div id="bg"></div>
<script>
  // ?bg=light simulates a bright, daylight room — the hard case for readability
  if (new URLSearchParams(location.search).get("bg") === "light")
    document.getElementById("bg").style.background =
      "radial-gradient(70% 80% at 55% 40%, #fdfdfb 0%, #ececE4 45%, #cfd3cd 75%, #a8b0ab 100%)";
</script>
<iframe src="frame.html"></iframe><iframe src="camera.html"></iframe></body></html>
